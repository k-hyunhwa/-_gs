<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관산중학교 하노이의 탑 챌린지</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Pretendard & Inter 폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    * {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      touch-action: manipulation;
    }

    /* 네온 글로우 및 그림자 */
    .glow-indigo {
      box-shadow: 0 0 20px -3px rgba(99, 102, 241, 0.5);
    }
    .glow-green {
      box-shadow: 0 0 16px 2px rgba(34, 197, 94, 0.7);
    }
    
    /* 펄스 애니메이션 */
    @keyframes ledPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.15); }
    }
    .led-active {
      animation: ledPulse 1.8s infinite ease-in-out;
    }
    
    /* 가로 바 형태 램프 네온 글로우 */
    .lamp-bar-on {
      box-shadow: 0 0 12px 2px rgba(52, 211, 153, 0.8), 0 0 4px rgba(255, 255, 255, 0.6);
      animation: barPulse 1.8s infinite ease-in-out;
    }
    @keyframes barPulse {
      0%, 100% { opacity: 1; filter: brightness(1.1); }
      50% { opacity: 0.8; filter: brightness(0.9); }
    }

    /* 드래그 및 호버 시각 피드백 */
    .peg-drop-target {
      background-color: rgba(99, 102, 241, 0.15) !important;
      border-color: rgba(129, 140, 248, 0.8) !important;
    }

    /* 부드러운 스크롤바 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.8);
      border-radius: 9999px;
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen h-[100dvh] flex flex-col justify-between overflow-x-hidden relative selection:bg-indigo-500 selection:text-white">

  <!-- 배경 오로라 이펙트 -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute -top-32 -left-32 w-80 md:w-96 h-80 md:h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
    <div class="absolute top-1/3 -right-32 w-80 md:w-96 h-80 md:h-96 bg-purple-600/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-32 left-1/3 w-80 md:w-96 h-80 md:h-96 bg-cyan-600/20 rounded-full blur-3xl"></div>
  </div>

  <!-- 우측 실시간 순위표 (화면을 가리지 않는 슬라이드 드로어 형태) -->
  <div id="rankingPanel" class="fixed top-24 right-0 z-40 transition-transform duration-300 translate-x-[230px] flex items-start drop-shadow-2xl">
    <!-- 패널 열기/닫기 토글 버튼 -->
    <button id="toggleRankBtn" class="bg-slate-900/95 border-y border-l border-indigo-500/50 text-amber-300 px-2.5 py-4 rounded-l-2xl shadow-xl backdrop-blur-md flex flex-col items-center gap-1.5 hover:text-white hover:bg-slate-800 transition-all">
      <i data-lucide="trophy" class="w-4 h
